[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "calmcp"
version = "0.0.1"
description = "A thin, well-guarded CalDAV toolkit that lets an LLM read and manage calendars."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "PolyForm-Noncommercial-1.0.0" }
authors = [{ name = "Erik Bitzek", email = "e.bitzek@mpi-susmat.de" }]
keywords = ["caldav", "calendar", "mcp", "icalendar"]
dependencies = [
    "caldav>=1.3",
    "icalendar>=5.0",
    "recurring-ical-events>=2.1",
    "keyring>=24.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
mcp = [
    "mcp>=1.2",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "radicale>=3.1",
    "types-PyYAML>=6.0",
    "mcp>=1.2",
]

[project.scripts]
calmcp = "calmcp.cli:main"
calmcp-mcp = "calmcp.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["calmcp"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
no_implicit_optional = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
